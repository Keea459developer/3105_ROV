name: Build 3105 ROV IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/3105.xcarchive/Products/Applications/3105.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload build/3105-unsigned.ipa
          shasum -a 256 build/3105-unsigned.ipa > build/3105-unsigned.ipa.sha256
          ls -lh build/3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ROV-IPA
          path: |
            build/3105-unsigned.ipa
            build/3105-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
